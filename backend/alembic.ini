# Alembic multidb configuration for Pollwise

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os
databases = identity, election, ballot

[identity]
sqlalchemy.url = postgresql+psycopg2://identity_user:identity_pass@localhost:5433/identity_db

[election]
sqlalchemy.url = postgresql+psycopg2://election_user:election_pass@localhost:5433/election_db

[ballot]
sqlalchemy.url = postgresql+psycopg2://ballot_user:ballot_pass@localhost:5433/ballot_db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
